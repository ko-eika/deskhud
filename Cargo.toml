# =============================================================================
# DeskHud — Cargo Workspace
# =============================================================================

[workspace]
resolver = "2"
members = [
    "crates/deskhud-ui",
    "crates/deskhud-package",
    "crates/deskhud-engine",
    "crates/deskhud-runtime",
    "crates/deskhud-sdk",
    "crates/deskhud-egui",
    "crates/deskhud-xtask",
    "packs/pet-deskhud-specs",
    "packs/pet-deskhud-blob",
    "packs/hud-deskhud-demo",
]
default-members = [
    "crates/deskhud-ui",
    "crates/deskhud-package",
    "crates/deskhud-engine",
    "crates/deskhud-runtime",
    "crates/deskhud-sdk",
]

[workspace.package]
version = "0.6.2"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["KO.EIKA"]
description = "DeskHud — extensible desktop pet packs + HUD plugins (egui)."
repository = "https://github.com/ko-eika/deskhud"
keywords = ["desktop-pet", "hud", "egui"]
categories = ["gui"]

[workspace.dependencies]
deskhud-ui = { path = "crates/deskhud-ui" }
deskhud-package = { path = "crates/deskhud-package" }
deskhud-engine = { path = "crates/deskhud-engine" }
deskhud-runtime = { path = "crates/deskhud-runtime" }
deskhud-sdk = { path = "crates/deskhud-sdk" }
pet-deskhud-specs = { path = "packs/pet-deskhud-specs" }
pet-deskhud-blob = { path = "packs/pet-deskhud-blob" }
hud-deskhud-demo = { path = "packs/hud-deskhud-demo" }

egui = "0.36"
egui-winit = { version = "0.36", default-features = false, features = ["links"] }
egui_glow = { version = "0.36", features = ["winit"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
glutin = "0.32"
glutin-winit = "0.5"
glow = "0.17"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
thiserror = "2.0"

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
core-graphics = "0.23.2"
core-foundation = "0.9.4"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSScreen"] }
# 设置页图标/预览：SVG 栅格化（图标类无需系统字体）
resvg = { version = "0.45", default-features = false }

windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-numerics = "0.3"

# Windows：把 .ico 嵌进 exe（资源管理器图标）
winresource = "0.1"

# `.deskhud` zip 读写
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

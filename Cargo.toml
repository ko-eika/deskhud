# =============================================================================
# DeskHud — Cargo Workspace
# =============================================================================

[workspace]
resolver = "2"
members = [
    "crates/core/*",
    "crates/tools/*",
    "crates/packs/*",
    "crates/platform/*",
    "crates/apps/*",
]
default-members = [
    "crates/core/deskhud-engine",
    "crates/core/deskhud-runtime",
    "crates/core/deskhud-ui",
    "crates/core/deskhud-sdk",
    "crates/core/deskhud-package",
]

[workspace.package]
version = "0.8.2"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
authors = ["KO.EIKA"]
description = "DeskHud — extensible desktop pet packs + HUD plugins (egui)."
repository = "https://github.com/ko-eika/deskhud"
keywords = ["desktop-pet", "hud", "egui"]
categories = ["gui"]

[workspace.dependencies]
# -----------------------------------------------------------------------------
# DeskHud 内部 crate：按依赖方向排列，避免把应用层依赖混入领域层。
# -----------------------------------------------------------------------------
deskhud-engine = { path = "crates/core/deskhud-engine" }
deskhud-runtime = { path = "crates/core/deskhud-runtime" }
deskhud-ui = { path = "crates/core/deskhud-ui" }
deskhud-package = { path = "crates/core/deskhud-package" }
deskhud-sdk = { path = "crates/core/deskhud-sdk" }

# 内置宠物 / HUD 包：由 deskhud-runtime 注册，不属于 UI 壳。
pet-deskhud-mochi = { path = "crates/packs/pet-deskhud-mochi" }
pet-deskhud-sesame = { path = "crates/packs/pet-deskhud-sesame" }
hud-deskhud-demo = { path = "crates/packs/hud-deskhud-demo" }

# 平台中性契约与平台实现；OS 类型只允许出现在这些平台 crate 内。
deskhud-platform = { path = "crates/platform/deskhud-platform" }
deskhud-platform-windows = { path = "crates/platform/deskhud-platform-windows" }
deskhud-platform-macos = { path = "crates/platform/deskhud-platform-macos" }
deskhud-platform-linux-gtk = { path = "crates/platform/deskhud-platform-linux-gtk" }

# -----------------------------------------------------------------------------
# desktop_egui 的窗口与设置页：winit + egui + OpenGL。
# -----------------------------------------------------------------------------
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

egui = "0.36.1"
egui-winit = { version = "0.36.1", default-features = false, features = ["links"] }

glow = "0.18.0"
egui_glow = { version = "0.36.1", features = ["winit"] }

glutin = "0.32.3"
glutin-winit = "0.5.0"

# 应用错误、日志、窗口句柄和通用序列化。
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
raw-window-handle = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
thiserror = "2.0.20"
ttf-parser = "0.25.1"

# 设置页资源：位图解码与 SVG 栅格化。
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
resvg = { version = "0.48.1", default-features = false }

# macOS AppKit / CoreGraphics；仅由 macOS 平台实现使用。
core-graphics = "0.25.0"
core-foundation = "0.10.1"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSScreen",
    "NSWindow",
    "NSView",
    "NSResponder",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSColor",
    "objc2-core-graphics",
] }

# Windows Win32 / DirectComposition；仅由 Windows 平台实现使用。
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Globalization",
] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
] }
windows-numerics = "0.3.1"

# 打包与 Windows 资源：构建脚本、.deskhud 压缩包和图标资源。
winresource = "0.1.31"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Community WASM components. Keep the runtime dependency host-only; SDK uses
# wit-bindgen to generate guest-side bindings from the shared WIT contract.
wasmtime = { version = "38.0.0", default-features = false, features = ["cranelift", "component-model", "runtime"] }
wit-bindgen = "0.44.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Refined Friendly Blue Ghost</title>
  <desc id="desc">A polished, 3D-styled blue ghost mascot with soft lighting.</desc>
  
  <defs>
    <!-- 1. 更丰富的背景渐变 -->
    <radialGradient id="bgGradient" cx="0.5" cy="0.5" r="0.8">
      <stop offset="0%" stop-color="#2A6EFF"/>
      <stop offset="100%" stop-color="#091E5C"/>
    </radialGradient>

    <!-- 2. 幽灵主体的立体渐变 (模拟顶部光照) -->
    <radialGradient id="bodyGradient" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E6F4FF"/>
      <stop offset="100%" stop-color="#A0D8F1"/>
    </radialGradient>

    <!-- 3. 眼睛的高光渐变 -->
    <radialGradient id="eyeShine" cx="0.3" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </radialGradient>

    <!-- 4. 底部环境光/反光 -->
    <radialGradient id="floorGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#4DABFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4DABFF" stop-opacity="0"/>
    </radialGradient>

    <!-- 5. 更柔和、更自然的阴影 -->
    <filter id="softShadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- 6. 底部光晕滤镜 -->
    <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect x="16" y="16" width="480" height="480" rx="94" fill="url(#bgGradient)"/>

  <!-- 底部环境光 (模拟地面反光) -->
  <ellipse cx="256" cy="430" rx="130" ry="20" fill="url(#floorGlow)" filter="url(#glowFilter)"/>

  <!-- 幽灵主体 -->
  <g filter="url(#softShadow)">
    <path d="M145 319C141 291 142 250 146 218C153 157 195 120 256 120C317 120 359 157 366 218C370 250 371 291 367 319C364 340 350 358 333 365C318 371 304 366 292 353C281 374 270 386 256 386C242 386 231 374 220 353C208 366 194 371 179 365C162 358 148 340 145 319Z" 
          fill="url(#bodyGradient)" 
          stroke="#8CC6FF" 
          stroke-width="2" 
          stroke-linejoin="round"/>
    
    <!-- 眼睛 -->
    <g id="eyes">
      <!-- 左眼 -->
      <circle cx="216" cy="240" r="18" fill="#1A3B6D"/>
      <circle cx="216" cy="240" r="10" fill="url(#eyeShine)"/>
      <circle cx="210" cy="234" r="4" fill="#FFFFFF" opacity="0.8"/> <!-- 眼神光 -->

      <!-- 右眼 -->
      <circle cx="296" cy="240" r="18" fill="#1A3B6D"/>
      <circle cx="296" cy="240" r="10" fill="url(#eyeShine)"/>
      <circle cx="290" cy="234" r="4" fill="#FFFFFF" opacity="0.8"/> <!-- 眼神光 -->
    </g>

    <!-- 嘴巴 (更精致的贝塞尔曲线) -->
    <path d="M244 294 Q256 308 268 294" fill="none" stroke="#1A3B6D" stroke-width="4" stroke-linecap="round"/>
    
    <!-- 脸颊红晕 (增加可爱感) -->
    <ellipse cx="195" cy="275" rx="12" ry="6" fill="#FF9AA2" opacity="0.2"/>
    <ellipse cx="317" cy="275" rx="12" ry="6" fill="#FF9AA2" opacity="0.2"/>
  </g>
</svg>
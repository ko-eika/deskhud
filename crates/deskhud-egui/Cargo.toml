[package]
name = "deskhud-egui"
description = "DeskHud egui desktop-pet shell."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "deskhud"
path = "src/main.rs"

[dependencies]
deskhud-engine = { workspace = true }
deskhud-runtime = { workspace = true }
deskhud-ui = { workspace = true }
egui = { workspace = true }
egui-winit = { workspace = true }
egui_glow = { workspace = true }
winit = { workspace = true }
glutin = { workspace = true }
glutin-winit = { workspace = true }
glow = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
raw-window-handle = { workspace = true }
image = { workspace = true }
resvg = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
windows = { workspace = true }
windows-numerics = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { workspace = true }
core-foundation = { workspace = true }
objc2-app-kit = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-core-foundation = { workspace = true }
objc2-core-graphics = { workspace = true }

[build-dependencies]
winresource = { workspace = true }

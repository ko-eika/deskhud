<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 身体渐变 -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD2E0"/>
      <stop offset="100%" style="stop-color:#FFF0F5"/>
    </linearGradient>
    <!-- 粉色瞳孔渐变 -->
    <radialGradient id="pupilGrad" cx="30%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFD1DF"/>
      <stop offset="100%" stop-color="#D96F98"/>
    </radialGradient>
    <!-- 地面阴影 -->
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <!-- 蝴蝶结渐变 -->
    <linearGradient id="bowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC2D6"/>
      <stop offset="100%" stop-color="#D96592"/>
    </linearGradient>
    <radialGradient id="bowKnotGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFE0EA"/>
      <stop offset="100%" stop-color="#E77BA4"/>
    </radialGradient>
  </defs>

  <!-- 地面投影 -->
  <ellipse cx="256" cy="442" rx="152" ry="24" fill="url(#groundShadow)"/>

  <!-- 蝴蝶结 -->
  <path d="M250.735 136.7575 s-16.205 48.03-29.8675 73.0575 c-2.565 4.7-9.0075 5.4375-12.5325 1.405 L201 202.8275 a22.11375 22.11375 0 0 0-14.43-7.45 l-10.175-1.03 c-6.2675-.635-9.1475-8.13-4.91-12.7925 c9.36-10.2975 22.1575-24.52 25.11-28.5375 c4.7825-6.5025 40.365-39.2175 54.14-16.26z M260.9325 135.705 s16.205 48.03 29.8675 73.0575 c2.565 4.7 9.0075 5.4375 12.5325 1.405 l7.335-8.3925 a22.11375 22.11375 0 0 1 14.43-7.45 l10.175-1.03 c6.2675-.635 9.1475-8.13 4.91-12.7925 c-9.36-10.2975-22.1575-24.52-25.11-28.5375 c-4.7825-6.505-40.3675-39.2175-54.14-16.26z"
        fill="url(#bowGrad)" stroke="#B85C78" stroke-width="3" stroke-linejoin="round"/>
  <path d="M248.8375 134.8 s-15.5475 24.0275-39.0125 31.9125 c-23.465 7.885-33.7925 .975-31.6175-6.1125 S239.775 128.5175 248.8375 134.8z"
        fill="#D56F9C"/>
  <path d="M263.615 133.6525 s15.5475 24.0275 39.0125 31.9125 33.7925 .975 31.6175-6.1125 c-2.175-7.0875-61.5675-32.0825-70.63-25.8z"
        fill="#D56F9C"/>
  <path d="M244.135 105.9575 S215.1525 80.4175 182.4375 77.835 c0 0-28.8325-5.87-25.32 33.4 .3825 4.275 .1 8.575-.73 12.785-1.6575 8.4025-2.985 23.6075 5.58 34.545 12.435 15.8775 62.205 5.3575 88.015-27.165 .0025 0 3.43-15.495-5.8475-25.4425z M267.5325 104.905 s28.9825-25.54 61.6975-28.1225 c0 0 28.8325-5.87 25.32 33.4-.3825 4.275-.1 8.575.73 12.785 1.6575 8.4025 2.985 23.6075-5.58 34.545-12.435 15.8775-62.205 5.3575-88.015-27.165-.0025 0-3.4325-15.495 5.8475-25.4425z"
        fill="url(#bowGrad)" stroke="#B85C78" stroke-width="3" stroke-linejoin="round"/>
  <path d="M207.5 116 c-8.3225 4.7825-1.0525 10.7125 8.705 9.0875 s26.975 0 27.5475 .67 c.575 .67-1.435-5.26-1.435-5.26 S215.8225 111.2175 207.5 116z M304.1675 114.9475 c-8.3225-4.7825-34.8175 4.495-34.8175 4.495 s-2.0075 5.93-1.435 5.26 c.575-.67 17.7925-2.295 27.5475-.67 c9.7575 1.6275 17.0275-4.3025 8.705-9.085z"
        fill="#D56F9C"/>
  <path d="M255.04 100.7925 s-16.07-1.435-16.07 11.4775 s-1.1475 30.705 16.07 30.705 s18.365-10.6175 18.365-23.53 s0-19.2275-18.365-18.6525z"
        fill="url(#bowKnotGrad)" stroke="#B85C78" stroke-width="3" stroke-linejoin="round"/>

  <!-- 身体轮廓 -->
  <path d="M110 308
           C107 235, 131 143, 229 125
           C241 122, 250 122, 256 122
           C262 122, 271 122, 283 125
           C381 143, 405 235, 402 308
           C399 338, 384 363, 366 372
           C357 378, 347 375, 338 372
           C311 424, 286 421, 256 381
           C226 421, 201 424, 174 372
           C165 378, 155 378, 146 375
           C129 369, 113 344, 110 308Z"
        fill="url(#bodyGrad)" stroke="#F29AB5" stroke-width="9" stroke-linejoin="round"/>

  <!-- 眼睛白色部分 -->
  <ellipse cx="186" cy="250" rx="49" ry="55" fill="#FFF8F2"/>
  <ellipse cx="326" cy="250" rx="49" ry="55" fill="#FFF8F2"/>

  <!-- 瞳孔 -->
  <circle cx="195" cy="256" r="21" fill="url(#pupilGrad)"/>
  <circle cx="335" cy="256" r="21" fill="url(#pupilGrad)"/>

  <!-- 瞳孔高光 -->
  <circle cx="187" cy="248" r="6.5" fill="white" opacity="0.8"/>
  <circle cx="327" cy="248" r="6.5" fill="white" opacity="0.8"/>

  <!-- 腮红 -->
  <circle cx="146" cy="314" r="15" fill="#FF9AA2" opacity=".45"/>
  <circle cx="366" cy="314" r="15" fill="#FF9AA2" opacity=".45"/>

  <!-- 小巧的微笑嘴巴 -->
  <path d="M241 329Q256 347 271 329" stroke="#B85C78" stroke-width="7" stroke-linecap="round" fill="none"/>
</svg>
